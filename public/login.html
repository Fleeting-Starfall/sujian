<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 素见</title>
<link rel="stylesheet" href="/css/colors_and_type.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-dot"></span>素见</div>
    <div class="auth-title">欢迎回来</div>
    <div class="auth-sub">登录后继续发现美好生活</div>
    <form id="login-form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="btn">登 录</button>
    </form>
    <div class="auth-switch">还没有账号？<a href="/register">立即注册</a></div>
    <div class="auth-switch">暂时不想登录？<a href="https://www.kodub.com/apps/polytrack">试一试kodub的polytrack游戏</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
'use strict';
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { toast('请输入用户名和密码', true); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    await api('/api/login', { method: 'POST', body: { username, password } });
    location.href = '/';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
